name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.88.0

jobs:
  quality:
    name: Rust 1.88 quality and package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install minimum Rust toolchain
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy

      - name: Check formatting
        run: cargo +"$RUST_TOOLCHAIN" fmt --all -- --check

      - name: Lint
        run: cargo +"$RUST_TOOLCHAIN" clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo +"$RUST_TOOLCHAIN" test --locked

      - name: Test bounded transfer liveness
        run: |
          cargo +"$RUST_TOOLCHAIN" build --locked
          lab/test-liveness.sh target/debug/packet-tide
          lab/test-telemetry.sh target/debug/packet-tide

      - name: Validate release and benchmark tooling
        run: |
          bash -n release/check-release.sh
          bash -n lab/test-liveness.sh
          bash -n lab/test-resume.sh
          bash -n lab/test-telemetry.sh
          bash -n lab/run-one.sh lab/validate-packet-sizes.sh
          python3 -m py_compile lab/capture-packets.py lab/udp-fault-proxy.py
          python3 -m py_compile lab/two-host/run-matrix.py lab/two-host/evaluate-release.py lab/two-host/evaluate-exploratory.py
          python3 -m json.tool lab/two-host/exploratory-v1.json >/dev/null

      - name: Verify clean source package and installation
        run: RUSTUP_TOOLCHAIN="$RUST_TOOLCHAIN" release/check-release.sh

  stable:
    name: Current stable Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install current stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Test with current stable Rust
        run: cargo +stable test --locked
