[package]
name = "packet-tide"
version = "0.2.0-alpha.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Authenticated whole-file transfer over UDP and TCP"
readme = "README.md"
repository = "https://github.com/matthiasgoergens/packet-tide"
keywords = ["udp", "file-transfer", "networking"]
categories = ["command-line-utilities", "network-programming"]
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/DESIGN.md", "/LICENSE", "/release/README.md"]

[[bin]]
name = "packet-tide"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
